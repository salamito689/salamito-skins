name: Atualizar preços OpenSkin
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar preços públicos
        run: python scripts/update_prices.py
      - name: Atualizar cotação exclusivamente pela Wise
        continue-on-error: true # Sem token, não substitui por outro câmbio; preços-base continuam atualizando.
        env:
          WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
        run: python scripts/update_fx.py
      - name: Auditar itens sem preço
        run: python scripts/audit_price_coverage.py || echo 'Auditoria indisponível; preços preservados'
      - name: Publicar somente quando houver dados válidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json fx.json
          if test -f price-coverage.json; then git add price-coverage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar referências de preços YouPin"
            git push
          fi
