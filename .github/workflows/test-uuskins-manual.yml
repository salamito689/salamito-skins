name: UUSKINS manual read-only probe (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uuskins-read-only-manual-probe
  cancel-in-progress: false
jobs:
  market-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/uuskins-safe-integration
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline feed regression tests
        run: python -m unittest discover -s tests -p 'test_uuskins_feed.py' -v
      - name: Test guarded UUSKINS Wise pricing offline
        run: python -m unittest discover -s tests -p 'test_uuskins_price_math.py' -v
      - name: Fetch two Wise quotes (staging only)
        env:
          WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
        run: python scripts/fetch_uuskins_wise_staging.py
      - name: Upload Wise staging quotes (not production)
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-wise-staging-quotes
          path: uuskins-wise-quotes-staging.json
          retention-days: 1
      - name: Install signing dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Test exact CS2 screenshot intake (synthetic fixtures only)
        run: |
          python -m pip install Pillow
          python -m unittest discover -s tests -p test_exact_cs2_capture.py -v
      - name: Query UUSKINS market data (read-only)
        env:
          UUSKINS_APP_KEY: ${{ secrets.UUSKINS_APP_KEY }}
          UUSKINS_PRIVATE_KEY_PEM: ${{ secrets.UUSKINS_PRIVATE_KEY_PEM }}
        run: python scripts/test_uuskins.py
      - name: Query individual SKU listings (read-only)
        env:
          UUSKINS_APP_KEY: ${{ secrets.UUSKINS_APP_KEY }}
          UUSKINS_PRIVATE_KEY_PEM: ${{ secrets.UUSKINS_PRIVATE_KEY_PEM }}
        run: python scripts/test_uuskins_sku.py
      - name: Audit native UUSKINS exact-image availability (no paid renderer)
        run: python scripts/audit_uuskins_image_sources.py
      - name: Upload UUSKINS image-source audit
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-image-source-audit
          path: uuskins-image-source-audit.json
          retention-days: 3
      - name: Prepare exact Redline inspect render candidate (no paid API)
        run: python scripts/prepare_redline_render_candidate.py
      - name: Upload exact Redline render input (private workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-redline-render-candidate
          path: uuskins-redline-render-candidate.json
          retention-days: 3
      - name: Build sanitized staging listing feed
        run: python scripts/build_uuskins_feed.py
      - name: Plan exact listing image requests (dry run, no API charges)
        run: python scripts/plan_exact_skin_renders.py
      - name: Upload exact image render plan (no rendered images)
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-exact-render-plan-dry-run
          path: exact-render-plan-staging.json
          retention-days: 3
      - name: Validate staging feed integrity
        run: python scripts/validate_uuskins_feed.py
      - name: Build explicitly labeled BRL simulation (USD assumption only)
        env:
          UUSKINS_STAGING_ASSUME_USD: '1'
        run: python scripts/build_uuskins_brl_staging.py
      - name: Fetch representative Steam model images (staging only)
        run: python scripts/fetch_steam_representative_images.py
      - name: Render searchable BRL simulation (local artifact only)
        run: python scripts/render_uuskins_brl_simulation.py
      - name: Upload isolated BRL simulation (never production)
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-brl-simulation-unverified-usd
          path: |
            uuskins-prices-brl-staging.json
            uuskins-brl-simulation.html
          retention-days: 2
      - name: Package isolated static preview (no deployment)
        run: python scripts/package_uuskins_preview.py
      - name: Upload ready-to-preview static staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-static-staging-preview
          path: uuskins-staging-preview/
          retention-days: 3
      - name: Upload isolated SKU preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-sku-read-only-preview
          path: |
            uuskins-sku-preview.json
            uuskins-feed-staging.json
            uuskins-lab.html
          retention-days: 3
      - name: Upload one exact AK inspect link for sandbox test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-one-inspect-link
          path: uuskins-one-inspect-link.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Upload isolated preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-read-only-preview
          path: uuskins-preview.json
          retention-days: 3
