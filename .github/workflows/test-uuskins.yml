name: UUSKINS read-only API probe (staging)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/uuskins-safe-integration
    paths:
      - 'scripts/test_uuskins.py'
      - '.github/workflows/test-uuskins.yml'
permissions:
  contents: read
jobs:
  market-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Query UUSKINS market data (read-only)
        env:
          UUSKINS_APP_KEY: ${{ secrets.UUSKINS_APP_KEY }}
          UUSKINS_PRIVATE_KEY_PEM: ${{ secrets.UUSKINS_PRIVATE_KEY_PEM }}
        run: python scripts/test_uuskins.py
      - name: Upload isolated preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uuskins-read-only-preview
          path: uuskins-preview.json
          retention-days: 3
