name: Validate staging catalog layout
on:
  push:
    branches:
      - feature/uuskins-safe-integration
    paths:
      - catalogo.html
      - tests/test_catalog_layout.py
      - .github/workflows/validate-catalog-staging.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check layout, image alignment and price disclaimers
        run: python -m unittest discover -s tests -p test_catalog_layout.py -v
